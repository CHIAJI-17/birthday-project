<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday Surprises · for my favourite human</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="surprises">
<div id="site-nav"></div>
<main class="container py-5">
  <h1 class="page-title text-center">Birthday surprises</h1>
  <p class="text-center lead-soft mx-auto">Four gifts, revealed on the same days as the letters.</p>
  <section id="gift-gate" class="paper torn mx-auto text-center" hidden>
    <p class="hand fs-2 mb-2">One thing first ♡</p>
    <p>Your surprises open once you've finished the questionnaire. It may or may not be helping me plan your gifts. SOrry if they're many.</p>
    <a class="btn btn-scrap btn-primary-scrap" href="questionnaire.html">Go to the questionnaire</a>
    <div id="gate-code-wrap" class="mt-4 pt-3 border-top" hidden>
      <label for="gate-code" class="small">Already finished it? Enter your unlock code:</label>
      <div class="input-group mt-2"><input id="gate-code" class="form-control" type="text" autocomplete="off"><button id="gate-code-btn" class="btn btn-scrap btn-primary-scrap" type="button">Unlock</button></div>
      <p id="gate-code-msg" class="small mt-2 mb-0 text-danger"></p>
    </div>
  </section>
  <div id="gifts-wrap" hidden><div id="gifts-list" class="row g-4 mt-2"></div></div>
</main>
<footer class="text-center py-4 hand">made with love · scrapbook 2026 ♡</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/surprises.js"></script>
</body>
</html>
